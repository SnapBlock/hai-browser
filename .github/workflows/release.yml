name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  vsix:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check tag matches extension version
        run: test "v$(node -p "require('./packages/extension/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm --filter hai-browser run package
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/extension/hai-browser.vsix
          generate_release_notes: true
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: packages/extension
        run: pnpm exec vsce publish --packagePath hai-browser.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10 publish packages/extension/hai-browser.vsix
