name: Publish npm package
on:
  push:
    tags: ['hai-browser-vite@*', 'hai-browser-next@*']
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Publish with npm trusted publishing (OIDC)
        run: |
          name="${GITHUB_REF_NAME%@*}"
          version="${GITHUB_REF_NAME##*@}"
          case "$name" in
            hai-browser-vite) dir=packages/vite-plugin ;;
            hai-browser-next) dir=packages/next-plugin ;;
            *) echo "Unknown package in tag: $name"; exit 1 ;;
          esac
          test "$(node -p "require('./$dir/package.json').version")" = "$version"
          cd "$dir" && npm publish --access public
